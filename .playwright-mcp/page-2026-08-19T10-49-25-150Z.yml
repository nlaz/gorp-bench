- generic [ref=f1e2]:
  - button "◐ theme" [ref=f1e3] [cursor=pointer]
  - heading "s36 — Claude Code vs Claude Code + gorp (desc-v12), 150 instances, claude-sonnet-5" [level=1] [ref=f1e4]
  - generic [ref=f1e5]:
    - text: SWE-Explore · 150 tasks · 2 arms · 300 agent sessions · $55.96 · run
    - code [ref=f1e6]: s36
  - heading "What this is" [level=2] [ref=f1e7]
  - paragraph [ref=f1e8]: The question. A coding agent given a bug report has to find the code that needs changing. It does that by searching the repository. This measures whether the search tool it is given changes how well it finds that code — and what the tool costs.
  - paragraph [ref=f1e9]: The benchmark. SWE-Explore is 848 real GitHub issues across 203 repositories and 10 languages. For each one it records the code regions that agents who actually fixed the bug read along the way, intersected across several successful attempts. That is the answer key. The agent under test returns at most five regions — a file path and a line range — and is scored on how well those five overlap the key.
  - paragraph [ref=f1e10]: "The arms. Each arm is the same agent on the same task with the same prompt. The only difference is which search tools exist:"
  - table [ref=f1e12]:
    - rowgroup [ref=f1e13]:
      - row [ref=f1e14]:
        - columnheader "arm" [ref=f1e15]
        - columnheader "tools available" [ref=f1e16]
        - columnheader "meaning" [ref=f1e17]
      - row [ref=f1e18]:
        - cell "cc" [ref=f1e19]
        - cell "Read, Glob, Grep" [ref=f1e20]
        - cell "built-in Grep only" [ref=f1e21]
      - row [ref=f1e22]:
        - cell "cc-gorp" [ref=f1e23]
        - cell "?" [ref=f1e24]
        - cell "cc-gorp" [ref=f1e25]
  - generic [ref=f1e26]: Why an arm that differs by one flag. Both arms are the same agent, same prompt, same tool description, same index — the only difference is whether the search tool expands the query with vocabulary mined from the repository's own bridge files. A contrast that narrow is what lets a difference be attributed to the mechanism rather than to the tool being present at all.
  - heading "How to read the numbers" [level=2] [ref=f1e27]
  - table [ref=f1e29]:
    - rowgroup [ref=f1e30]:
