        - cell "Same question at file level — did it reach the right files, never mind the exact lines?" [ref=f1e39]
      - row [ref=f1e40]:
        - cell "ctxEff" [ref=f1e41]
        - cell "Of the lines the agent handed back, what share were actually useful? Rewards being relevant and compact." [ref=f1e42]
      - row [ref=f1e43]:
        - cell "nDCG@500" [ref=f1e44]
        - cell "Coverage within a 500-line budget, rewarding useful regions ranked earlier." [ref=f1e45]
      - row [ref=f1e46]:
