        - cell "US dollars of model spend for that one session." [ref=f1e54]
      - row [ref=f1e55]:
        - cell "turns" [ref=f1e56]
        - cell "How many back-and-forth steps the agent took." [ref=f1e57]
  - generic [ref=f1e58]: "Difference, confidence, wins/losses. Every comparison is paired: the same task run under both arms, so task difficulty cancels. The difference is the average change. The 95% confidence interval is the range the true value plausibly sits in — if it contains zero, there is no detectable effect. The wins/losses count how many individual tasks moved each way, which catches an average dragged around by a handful of tasks rather than a consistent shift."
